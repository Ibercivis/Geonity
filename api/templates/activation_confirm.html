<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar cuenta - Geonity</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
  }
  .container {
    background-color: #ffffff;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 0;
  }
  .header img {
    width: 100%;
    height: auto;
  }
  .content {
    padding: 20px;
    text-align: center;
  }
  .footer {
    padding: 10px;
    text-align: center;
    font-size: 12px;
  }
  .button {
    display: inline-block;
    padding: 10px 20px;
    margin-top: 20px;
    background-color: #000000;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }
  .button:hover {
    background-color: #333333;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://geonity.ibercivis.es/static/img/header_geonity.png" alt="Cabecera Geonity"/>
    </div>
    <div class="content">
      <h1>Confirma tu cuenta</h1>
      <p>Haz clic en el botón para activar tu cuenta en Geonity.</p>
      <form method="post" action="">
        <input type="hidden" name="key" value="{{ key }}">
        <button type="submit" class="button">Activar mi cuenta</button>
      </form>
    </div>
    <div class="footer">
      <p>Si no has solicitado esta activación, ignora este mensaje.</p>
    </div>
  </div>
</body>
</html>
